plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.deviloufr.markettracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.deviloufr.markettracker"
        minSdk 26
        targetSdk 34

        // --- Version management ---------------------------------------------
        // Single source of truth for the app version. Bump versionName here on
        // each release. versionCode auto-increments in CI (from VERSION_CODE,
        // set to the GitHub run number) so every build is installable over the
        // previous one; local builds fall back to a fixed value.
        versionName "1.1.0"
        versionCode System.getenv("VERSION_CODE")?.toInteger() ?: 2

        vectorDrawables { useSupportLibrary true }
    }

    // Stable signing key so every CI build is signed with the SAME key. Without
    // this, each build uses a throwaway key and Android refuses to update in place
    // ("app not installed" unless you first uninstall). The key file is NOT in the
    // repo; CI writes it from a base64 secret before building, and it's present
    // locally for developer builds. When absent, builds fall back to the default
    // debug signing so a checkout without the key still compiles.
    def sharedKeystore = file('markettracker.keystore')
    signingConfigs {
        shared {
            if (sharedKeystore.exists()) {
                storeFile sharedKeystore
                storePassword 'markettracker'
                keyAlias 'markettracker'
                keyPassword 'markettracker'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            if (sharedKeystore.exists()) signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (sharedKeystore.exists()) signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Async image loading for per-asset logos (with category-icon fallback).
    implementation 'io.coil-kt:coil-compose:2.6.0'

    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
