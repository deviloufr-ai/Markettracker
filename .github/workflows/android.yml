name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the release notes can list recent commits

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Decode signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > android/app/markettracker.keystore
            echo "Signing key decoded."
          else
            echo "No signing key secret set; using default debug signing."
          fi

      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketTracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # --- In-app update channel ---------------------------------------------
      # Stage a fixed-name APK plus a latest.json manifest, then publish both to
      # the PUBLIC releases repo. The app reads them from the stable
      # `releases/latest/download/…` URLs (see UpdateApi.kt). versionCode is the
      # run number, matching the value baked into the APK above, so the app can
      # tell when a newer build exists.
      - name: Stage release assets
        id: stage
        working-directory: android
        run: |
          set -e
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          VC="${{ github.run_number }}"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/MarketTracker.apk
          NOTES=$(git log -8 --pretty=format:'- %s' | tr -d '\r')
          jq -n \
            --argjson versionCode "$VC" \
            --arg versionName "$VN" \
            --arg notes "$NOTES" \
            --arg apkUrl "https://github.com/deviloufr-ai/markettracker-releases/releases/latest/download/MarketTracker.apk" \
            '{versionCode: $versionCode, versionName: $versionName, notes: $notes, apkUrl: $apkUrl}' \
            > out/latest.json
          {
            echo "tag=v${VN}-b${VC}"
            echo "title=MarketTracker ${VN} (build ${VC})"
          } >> "$GITHUB_OUTPUT"
          echo "----- latest.json -----"; cat out/latest.json

      - name: Publish to public releases repo
        working-directory: android/out
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASES_TOKEN secret not set — skipping in-app update publish."
            echo "(The APK is still available as the build artifact above.)"
            exit 0
          fi
          set -e
          NOTES=$(git log -8 --pretty=format:'- %s' | tr -d '\r')
          gh release create "${{ steps.stage.outputs.tag }}" \
            MarketTracker.apk latest.json \
            --repo deviloufr-ai/markettracker-releases \
            --title "${{ steps.stage.outputs.title }}" \
            --notes "$NOTES"
